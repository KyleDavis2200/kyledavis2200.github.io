<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kyle Davis | Mechanical Engineering Portfolio</title>
  <meta name="description" content="Engineering design portfolio of Kyle Davis, Mechanical Engineering student at Missouri S&T specializing in CAD, DFM, FEA, and combat robotics." />
  <style>
    :root {
      --bg-main: #0f1216;
      --bg-card: #171b21;
      --bg-card-hover: #1e242c;
      --bg-accent: #13171c;
      --text-primary: #eef2f6;
      --text-secondary: #a0aab8;
      --text-muted: #6e7885;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --accent-green: #10b981;
      --border: #262c36;
      --radius: 10px;
      --max-w: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: #60a5fa;
    }

    /* Top Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 18, 22, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .brand span {
      color: var(--accent);
      font-weight: 500;
      font-size: 0.9rem;
      margin-left: 0.5rem;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-secondary);
      font-size: 0.92rem;
      font-weight: 500;
    }

    nav a:hover {
      color: var(--text-primary);
    }

    .btn-sm {
      background: var(--accent);
      color: #fff !important;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .btn-sm:hover {
      background: #2563eb;
    }

    /* Main Container */
    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 4rem 0;
      border-bottom: 1px solid var(--border);
    }

    /* Hero Section */
    .hero {
      padding: 4.5rem 0 4rem;
    }

    .
